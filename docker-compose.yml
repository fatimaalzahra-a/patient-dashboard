services:
  web:
    build: .
    command: exec gunicorn PatientDashboard.wsgi:application --bind 0.0.0.0:8000 --reload

    volumes:
      - .:/app
      - static:/app/static
      - media:/app/media
    ports:
      - "8000:8000"
      
    env_file:
      - .env
    networks:
      - backend_network



volumes:
  static:
  media:

networks:
  backend_network:
    driver: bridge
    # ipam:
    #   config:
    #     - subnet: 172.28.0.0/16
    #       gateway: 172.28.0.1  # Optional explicit gateway